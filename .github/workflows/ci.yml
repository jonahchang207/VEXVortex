name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files present
        run: |
          test -f README.md
          test -f LICENSE
          test -f .env.example
          test -f AGENTS.md
          echo "required files OK"

      - name: Secret hygiene (non-blocking audit)
        run: |
          set -e
          echo "Scanning for accidental secret patterns..."
          # Fail on high-confidence accidental commits. .env.example is allowlisted.
          ! rg -n --glob '!.env.example' --glob '!.github/workflows/ci.yml' -i 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY|service_role.{0,5}key.{0,5}eyJ|gh[op]_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9_-]{10,}' . || (echo "Possible secret committed. Remove before pushing." && exit 1)
          echo "secret scan OK"

      - name: Markdown sanity
        run: |
          echo "README lines: $(wc -l < README.md)"
          test -s README.md
